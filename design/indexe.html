<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3e7d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 300px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: auto;
        }

        .card-content {
            padding: 20px;
        }

        .card-content h3 {
            margin: 0;
            color: #333;
        }

        .card-content p {
            color: #666;
            font-size: 14px;
            margin: 10px 0 0;
        }

        .card-footer {
            margin-top: 10px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="path-to-image.jpg" alt="Card Image">
        <div class="card-content">
            <h3>HTML & CSS Foundation</h3>
            <p>Published: 21 Dec 2023</p>
            <div class="card-footer">By Greg Hooper</div>
        </div>
    </div>
</body>
</html>
